<header class="site-header">

  <div class="header-inner">


    <!-- BRAND -->

    <a
      class="brand"
      routerLink="/home"
      (click)="closeMobileMenu()"
    >

      <img
        src="/assets/fujitec_logo.png"
        alt="Fujitec"
        class="brand-logo"
      />

      <span class="brand-divider"></span>

      <span class="brand-title">
        CONFLUENCE
      </span>

    </a>





    <!-- DESKTOP NAV -->

    <nav
      class="desktop-navigation"
      aria-label="Main navigation"
    >



      <a
        routerLink="/home"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        Home
      </a>




      <a
        routerLink="/home"
        fragment="quick-access"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        Quick Access
      </a>




      <a
        routerLink="/home"
        fragment="news"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        News
      </a>




      <a
        routerLink="/home"
        fragment="events"
        class="nav-link"
        (click)="closeMobileMenu()"
      >
        Events
      </a>






      <!-- ============================
           EMPLOYEE HUB DROPDOWN
      ============================= -->


      <div class="employee-dropdown">


        <button
          type="button"
          class="nav-link dropdown-trigger"
        >

          Employee Hub

          <span class="dropdown-arrow">
            ▾
          </span>

        </button>




        <div class="employee-dropdown-menu">


          <button
            type="button"
            (click)="openEmployeeSection('celebration')"
          >

            🎉 Employee Celebrations

          </button>




          <button
            type="button"
            (click)="openEmployeeSection('recognition')"
          >

            🏆 Employee Recognition

          </button>

          <button
  type="button"
  (click)="openEmployeeSection('support')"
>
  🆘 Employee Support
</button>

<button
  type="button"
  (click)="openEmployeeSection('suggestion')"
>
  💡 Suggestion Box
</button>


        </div>


      </div>







      <a
        routerLink="/home"
        fragment="it-awareness"
        class="nav-link"
        (click)="closeMobileMenu()"
      >

        IT Awareness

      </a>




    </nav>






    <!-- RIGHT ACTIONS -->


    <div class="header-actions">


      <button
        type="button"
        class="search-button"
      >

        <span class="search-icon">
          ⌕
        </span>

        <span class="search-text">
          Search
        </span>

      </button>




      <button
        type="button"
        class="login-button"
      >

        Login

      </button>




      <button
        type="button"
        class="menu-button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-label="Toggle navigation"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>


    </div>



  </div>







  <!-- MOBILE NAV -->


  <nav
    class="mobile-navigation"
    [class.open]="mobileMenuOpen"
  >



    <a
      routerLink="/home"
      (click)="closeMobileMenu()"
    >
      Home
    </a>



    <a
      routerLink="/home"
      fragment="quick-access"
      (click)="closeMobileMenu()"
    >
      Quick Access
    </a>



    <a
      routerLink="/home"
      fragment="news"
      (click)="closeMobileMenu()"
    >
      News
    </a>



    <a
      routerLink="/home"
      fragment="events"
      (click)="closeMobileMenu()"
    >
      Events
    </a>






    <!-- MOBILE EMPLOYEE HUB -->

    <div class="employee-dropdown-menu">

      <button
        type="button"
        (click)="openEmployeeSection('celebration')"
      >
        <span>🎉</span>
        Employee Celebrations
      </button>
    
      <button
        type="button"
        (click)="openEmployeeSection('recognition')"
      >
        <span>🏆</span>
        Employee Recognition
      </button>
    
      <button
        type="button"
        (click)="openEmployeeSection('support')"
      >
        <span>🆘</span>
        Employee Support
      </button>

      <button
  type="button"
  (click)="openEmployeeSection('suggestion')"
>
  <span>💡</span>
  Suggestion Box
</button>
    
    </div>

    <a
      routerLink="/home"
      fragment="it-awareness"
      (click)="closeMobileMenu()"
    >

      IT Awareness

    </a>




  </nav>



</header>
