<main class="home-page">

  <section class="hero" id="home">

    <div class="hero-media">

      <img
        [src]="heroImages[currentHeroSlide]"
        alt="Fujitec corporate"
        class="hero-image"
      />

      <div class="hero-overlay"></div>

      <button
        type="button"
        class="hero-arrow hero-arrow-left"
        (click)="previousHeroSlide()"
      >
        ‹
      </button>

      <button
        type="button"
        class="hero-arrow hero-arrow-right"
        (click)="nextHeroSlide()"
      >
        ›
      </button>

      <div class="hero-controls">

        <div class="hero-indicators">

          <button
            *ngFor="let image of heroImages; let i = index"
            type="button"
            class="hero-indicator"
            [class.active]="i === currentHeroSlide"
            (click)="goToHeroSlide(i)"
          ></button>

        </div>

        <span class="hero-counter">
          {{ currentHeroSlide + 1 }}
          <span>/</span>
          {{ heroImages.length }}
        </span>

      </div>

    </div>

  </section>


  <section id="quick-access">
    <app-quick-access></app-quick-access>
  </section>


  <section id="news">
    <app-news></app-news>
  </section>


  <section id="events">
    <app-events></app-events>
  </section>


  <section id="it-awareness">
    <app-it-awareness></app-it-awareness>
  </section>


  <app-footer></app-footer>

</main>
